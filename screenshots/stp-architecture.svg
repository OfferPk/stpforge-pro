<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14" />
      <stop offset="100%" stop-color="#0a1324" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2e4f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <text x="500" y="45" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle">Zero-Trust Spanning Tree (RSTP / MSTP) Architecture</text>
  <text x="500" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Deterministic Root Positioning, Edge BPDU Guard, Loop Guard &amp; Sub-Second Convergence</text>

  <!-- Top: Core Layer (Primary & Secondary Root Bridges) -->
  <rect x="180" y="110" width="300" height="130" rx="10" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="2" />
  <rect x="200" y="125" width="260" height="26" rx="4" fill="url(#coreGrad)" />
  <text x="330" y="143" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Primary Core (Root Bridge)</text>
  <text x="330" y="175" fill="#34d399" font-family="monospace" font-weight="bold" font-size="13" text-anchor="middle">Priority: 0 (Deterministic)</text>
  <text x="330" y="195" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">MAC: 00:01:02:03:04:05</text>
  <text x="330" y="215" fill="#22d3ee" font-family="monospace" font-size="10" text-anchor="middle">All Ports Designated (11) Forwarding</text>

  <rect x="520" y="110" width="300" height="130" rx="10" fill="url(#nodeGrad)" stroke="#06b6d4" stroke-width="2" />
  <rect x="540" y="125" width="260" height="26" rx="4" fill="url(#coreGrad)" />
  <text x="670" y="143" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Secondary Core (Backup Root)</text>
  <text x="670" y="175" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="13" text-anchor="middle">Priority: 4096 (Standby)</text>
  <text x="670" y="195" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">MAC: 00:01:02:03:04:06</text>
  <text x="670" y="215" fill="#22d3ee" font-family="monospace" font-size="10" text-anchor="middle">Automatic Root Promotion on Failure</text>

  <!-- Core Interconnect Trunk -->
  <line x1="480" y1="175" x2="520" y2="175" stroke="#22d3ee" stroke-width="4" />
  <text x="500" y="165" fill="#22d3ee" font-family="monospace" font-size="9" text-anchor="middle">100G Trunk</text>

  <!-- Middle: Distribution & Access Switches -->
  <rect x="180" y="290" width="260" height="130" rx="10" fill="url(#nodeGrad)" stroke="#1b2b4d" />
  <text x="310" y="315" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Distribution Switch 1</text>
  <text x="310" y="338" fill="#fbbf24" font-family="monospace" font-size="11" text-anchor="middle">Priority: 8192 | Cost: 200</text>
  <text x="310" y="360" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">✓ Root Guard on Downlink Ports</text>
  <text x="310" y="380" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">✓ Loop Guard on Fiber Uplinks</text>
  <text x="310" y="400" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Root Port (10) -&gt; Primary Core</text>

  <rect x="560" y="290" width="260" height="130" rx="10" fill="url(#nodeGrad)" stroke="#1b2b4d" />
  <text x="690" y="315" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Distribution Switch 2</text>
  <text x="690" y="338" fill="#fbbf24" font-family="monospace" font-size="11" text-anchor="middle">Priority: 8192 | Cost: 200</text>
  <text x="690" y="360" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">✓ Root Guard on Downlink Ports</text>
  <text x="690" y="380" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">✓ Loop Guard on Fiber Uplinks</text>
  <text x="690" y="400" fill="#fb7185" font-family="monospace" font-size="10" text-anchor="middle">Alternate Port (01) Blocked</text>

  <!-- Uplink Lines -->
  <line x1="310" y1="290" x2="330" y2="240" stroke="#10b981" stroke-width="3" />
  <line x1="690" y1="290" x2="670" y2="240" stroke="#10b981" stroke-width="3" />
  <line x1="310" y1="290" x2="670" y2="240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="690" y1="290" x2="330" y2="240" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Bottom: Edge Access Layer -->
  <rect x="60" y="470" width="880" height="80" rx="10" fill="#080f1e" stroke="#1b2b4d" />
  <text x="500" y="495" fill="#22d3ee" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Zero-Trust Edge Access Layer (Workstations, VoIP Phones, Printers)</text>

  <rect x="80" y="505" width="260" height="35" rx="5" fill="#101c36" stroke="#10b981" />
  <text x="210" y="527" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">✓ BPDU Guard Enabled</text>

  <rect x="370" y="505" width="260" height="35" rx="5" fill="#101c36" stroke="#10b981" />
  <text x="500" y="527" fill="#34d399" font-family="monospace" font-size="11">✓ PortFast 0-Sec Forwarding</text>

  <rect x="660" y="505" width="260" height="35" rx="5" fill="#101c36" stroke="#f43f5e" />
  <text x="790" y="527" fill="#fb7185" font-family="monospace" font-size="11">✗ Rogue BPDU -&gt; Err-Disable</text>

  <!-- Bottom Callout: Key Security Rules -->
  <rect x="60" y="565" width="880" height="70" rx="8" fill="#080f1e" stroke="#1b2b4d" />
  <text x="500" y="585" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Zero-Trust Spanning Tree Defense Rules</text>
  <text x="80" y="608" fill="#34d399" font-family="sans-serif" font-size="10">1. Root Priority 0 locks root bridge position</text>
  <text x="390" y="608" fill="#34d399" font-family="sans-serif" font-size="10">2. Root Guard blocks rogue priority injection</text>
  <text x="700" y="608" fill="#34d399" font-family="sans-serif" font-size="10">3. BPDU Guard kills loops at access edge</text>
  <text x="80" y="625" fill="#34d399" font-family="sans-serif" font-size="10">4. Loop Guard blocks unidirectional fiber faults</text>
  <text x="390" y="625" fill="#34d399" font-family="sans-serif" font-size="10">5. PortFast suppresses TC broadcast storms</text>
  <text x="700" y="625" fill="#34d399" font-family="sans-serif" font-size="10">6. CoPP caps BPDU frame rate at 200 pps</text>
</svg>
